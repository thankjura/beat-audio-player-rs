[package]
name = "beat"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
async-channel = "2.5.0"
configparser = "3.3.0"
csv = "1.4.0"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gstreamer = { version = "0.25.4", features = ["v1_20"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
lofty = "0.25.5"
md5 = "0.8.1"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies.uuid]
version = "1.29.2"
features = [
    "v4", # Lets you generate random UUIDs
    "fast-rng", # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[build-dependencies]
glib-build-tools = "0.22.8"

